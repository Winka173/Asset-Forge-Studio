[project]
name = "asset-forge-studio"
version = "0.1.0"
description = "Local 3D asset quality workbench"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pillow>=11,<13", "numpy>=2,<3", "trimesh>=4.6,<5", "psutil>=7,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
